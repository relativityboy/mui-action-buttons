name: Checks and GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Test npm publishing decisions
        run: npm run test:publish

      - name: Check built package
        run: npm run test:package

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Check Storybook types
        run: npm run typecheck:storybook
      - name: Check landing page types
        run: npm run typecheck:site
      - name: Build landing page and Storybook
        run: npm run build:site
      - name: Install browser and system dependencies
        run: npm run storybook:install-browser -- --with-deps
      - name: Test stories in Chromium
        run: npm run test:storybook
      - name: Test the built site at its GitHub Pages path
        run: npm run test:site
      - name: Upload GitHub Pages site
        if: github.repository == 'relativityboy/mui-action-buttons' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist
          include-hidden-files: true

  deploy:
    if: github.repository == 'relativityboy/mui-action-buttons' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, storybook]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy landing page and Storybook
        id: deployment
        uses: actions/deploy-pages@v5
